services:
  postgres:
    image: postgres:16-alpine
    container_name: zest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zest
      POSTGRES_PASSWORD: zest
      POSTGRES_DB: zest
    ports:
      - "5433:5432"
    volumes:
      - zest_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zest -d zest"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: zest-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - zest_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  zest_pgdata:
  zest_redisdata:
